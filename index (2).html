<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TC SDO’39 – planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --oranje:#EE7203; --oranje-diep:#C85E00; --oranje-zacht:#FFF0E0;
  --zwart:#1A1A1A; --bg:#FFFFFF; --vlak:#F6F5F3; --lijn:#E4E1DC;
  --tekst:#1A1A1A; --tekst-2:#5E5B57; --rood:#C62828; --rood-zacht:#FDECEC;
  --groen:#2E7D32; --groen-zacht:#E8F3E9; --kop:#1A1A1A; --kop-tekst:#FFFFFF;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151515; --vlak:#1F1E1D; --lijn:#353330; --tekst:#F2F0ED; --tekst-2:#ABA7A1;
    --oranje-zacht:#3A2510; --rood-zacht:#3A1A1A; --groen-zacht:#1A2E1C; --kop:#0E0E0E;
    --oranje:#FF8A1F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151515; --vlak:#1F1E1D; --lijn:#353330; --tekst:#F2F0ED; --tekst-2:#ABA7A1;
  --oranje-zacht:#3A2510; --rood-zacht:#3A1A1A; --groen-zacht:#1A2E1C; --kop:#0E0E0E;
  --oranje:#FF8A1F; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tekst);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--kop)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oranje);outline-offset:2px}
a{color:var(--oranje-diep)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) a{color:var(--oranje)}}

header.top{background:var(--kop);color:var(--kop-tekst);border-bottom:4px solid var(--oranje);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1200px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 20px}
.merk{display:flex;align-items:baseline;gap:12px;padding-bottom:10px}
.merk b{font:700 26px/1 var(--cond);letter-spacing:.01em}
.merk b span{color:var(--oranje)}
.merk small{color:#BDB8B1;font-size:14px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#D9D5CF;text-decoration:none;padding:10px 12px 12px;font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{background:var(--oranje);color:#1A1A1A;font-weight:600}

main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.melding{background:var(--oranje-zacht);border-left:4px solid var(--oranje);padding:10px 14px;margin-bottom:18px;border-radius:4px;font-size:15px}
h1{font:700 34px/1.1 var(--cond);margin:0 0 4px}
h2{font:700 22px/1.2 var(--cond);margin:0 0 10px}
h3{font:600 17px/1.3 var(--body);margin:0 0 6px}
.sub{color:var(--tekst-2);margin:0 0 20px}
.kopregel{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.kopregel .sub{margin:0}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--lijn);background:var(--bg);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;color:var(--tekst)}
.btn:hover{border-color:var(--tekst-2)}
.btn.hoofd{background:var(--oranje);border-color:var(--oranje);color:#1A1A1A;font-weight:600}
.btn.hoofd:hover{background:var(--oranje-diep);border-color:var(--oranje-diep);color:#fff}
.btn.klein{padding:3px 9px;font-size:14px}
.btn.kaal{border-color:transparent;background:none;padding:4px 6px;color:var(--tekst-2)}
.btn.kaal:hover{color:var(--tekst)}
.btn[disabled]{opacity:.5;cursor:default}

/* seizoensstrook: het herkenbare element */
.strook{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:0 0 28px}
.strook a{display:flex;flex-direction:column;text-decoration:none;color:var(--tekst);border-radius:6px;padding:8px 6px 6px;background:var(--vlak);border:2px solid transparent;min-width:0}
.strook a:hover{border-color:var(--lijn)}
.strook a.nu{border-color:var(--oranje);background:var(--oranje-zacht)}
.strook a.voorbij .mnd{color:var(--tekst-2)}
.strook .mnd{font:700 18px/1 var(--cond);text-transform:capitalize}
.strook .tel{font-size:13px;color:var(--tekst-2);margin:2px 0 6px;white-space:nowrap}
.strook .balk{height:6px;border-radius:3px;background:var(--lijn);overflow:hidden;margin-top:auto}
.strook .balk i{display:block;height:100%;background:var(--zwart)}
.strook a.nu .balk i{background:var(--oranje)}
.strook .waarsch{color:var(--rood);font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .strook .balk i{background:var(--tekst-2)}}
@media (max-width:720px){.strook{grid-template-columns:repeat(6,1fr)}}

.raster{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.blok{border:1px solid var(--lijn);border-radius:8px;padding:16px 18px;background:var(--bg);min-width:0}
.blok.breed{grid-column:1/-1}
.blok h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.blok h2 small{font:500 14px var(--body);color:var(--tekst-2)}
.leeg{color:var(--tekst-2);font-size:15px;padding:6px 0}

.rij{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--lijn)}
.rij:first-of-type{border-top:0}
.rij .info{flex:1;min-width:0}
.rij .titel{font-weight:500;cursor:pointer}
.rij .titel:hover{text-decoration:underline}
.rij .meta{font-size:14px;color:var(--tekst-2)}
.rij.klaar .titel{text-decoration:line-through;color:var(--tekst-2)}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--oranje);margin-top:3px;flex:none}
.label{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--vlak);color:var(--tekst-2);white-space:nowrap}
.label.laat{background:var(--rood-zacht);color:var(--rood)}
.label.nu{background:var(--oranje-zacht);color:var(--oranje-diep)}
.label.bezig{background:var(--zwart);color:#fff}
.label.klaar{background:var(--groen-zacht);color:var(--groen)}
.label.thuis{background:var(--oranje);color:#1A1A1A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .label.nu{color:var(--oranje)} :root:not([data-theme="light"]) .label.bezig{background:#F2F0ED;color:#1A1A1A}}

select.mini{border:1px solid var(--lijn);border-radius:5px;padding:3px 6px;background:var(--bg);font-size:14px;max-width:170px}
select.mini.open{border-color:var(--oranje);background:var(--oranje-zacht)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters label{font-size:14px;color:var(--tekst-2);display:flex;gap:6px;align-items:center}
.filters select{border:1px solid var(--lijn);border-radius:6px;padding:6px 8px;background:var(--bg)}

.sectie{margin-bottom:24px}
.sectie > h3{display:flex;align-items:center;gap:8px;font:700 19px/1.2 var(--cond);border-bottom:2px solid var(--tekst);padding-bottom:4px;margin-bottom:2px}
.sectie.laat > h3{border-color:var(--rood);color:var(--rood)}
.sectie.nu > h3{border-color:var(--oranje)}

/* jaarplanning */
.jaar{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.maand{border:1px solid var(--lijn);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;scroll-margin-top:90px}
.maand.nu{border:2px solid var(--oranje)}
.maand header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.maand header b{font:700 22px/1 var(--cond);text-transform:capitalize}
.maand header span{font-size:13px;color:var(--tekst-2)}
.maand .rij{padding:6px 0}
.maand .afspr{font-size:14px;padding:5px 8px;border-radius:5px;background:var(--oranje-zacht);margin-top:6px;cursor:pointer}
.maand footer{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tekst-2)}

/* agenda */
.datumblok{flex:none;width:52px;text-align:center;border-radius:6px;background:var(--zwart);color:#fff;padding:4px 0}
.datumblok b{display:block;font:700 24px/1 var(--cond)}
.datumblok small{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .datumblok{background:#2A2826}}

/* wedstrijden */
.tabel-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:600 13px var(--body);color:var(--tekst-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--lijn);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--lijn);vertical-align:middle}
tr.dag td{background:var(--vlak);font:700 17px var(--cond);padding:6px 8px;border-bottom:0}
td.nowrap{white-space:nowrap}

/* velden */
.tijdlijn{position:relative;min-width:640px}
.tl-uren{display:flex;margin-left:120px;font-size:12px;color:var(--tekst-2)}
.tl-uren span{flex:1;border-left:1px solid var(--lijn);padding-left:3px}
.tl-rij{display:flex;align-items:stretch;border-top:1px solid var(--lijn);min-height:52px}
.tl-naam{width:120px;flex:none;padding:8px 8px 8px 0;font-weight:600;font-size:14px}
.tl-baan{position:relative;flex:1;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),var(--lijn) calc(10% - 1px),var(--lijn) 10%)}
.tl-blok{position:absolute;top:6px;bottom:6px;border-radius:5px;background:var(--oranje);color:#1A1A1A;font-size:12.5px;padding:3px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;border:1px solid var(--oranje-diep)}
.tl-blok.conflict{background:var(--rood);color:#fff;border-color:var(--rood)}

tr.voorbij td{color:var(--tekst-2)}
tr.volgende td{background:var(--oranje-zacht)}
.blok .meta{color:var(--tekst-2);font-size:14px}
.groot-naam{font:700 32px/1.1 var(--cond)}
/* inloggen en rollen */
.inlog{max-width:420px;margin:40px auto;border:1px solid var(--lijn);border-radius:10px;padding:24px}
.inlog h1{margin-bottom:6px}
.inlog .veld{margin-top:14px}
.uitlog{margin-left:12px;color:#D9D5CF;background:none;border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;align-self:center;margin-bottom:10px}
.uitlog:hover{color:#fff;border-color:#999}
body.vlagmodus nav.tabs a:not([data-v="vlaggers"]){display:none}
body.vlagmodus [data-act="wedNieuw"],body.vlagmodus [data-act="wedBewerk"]{display:none}
body.uit nav.tabs{display:none}
/* wie doet wat */
.wie-raster{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.wie-kaart{border:1px solid var(--lijn);border-radius:8px;padding:10px 12px;border-top:4px solid var(--zwart);min-width:0}
.wie-kaart.niemand{border-top-color:var(--oranje);background:var(--oranje-zacht)}
.wie-kop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wie-kop b{font:700 19px/1.2 var(--cond)}
.wie-kop span{font-size:13px;color:var(--tekst-2);white-space:nowrap}
.wie-kaart ul{list-style:none;margin:6px 0 0;padding:0;font-size:14.5px}
.wie-kaart li{padding:4px 0;border-top:1px solid var(--lijn);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wie-kaart li:first-child{border-top:0}
.wie-kaart .titel{cursor:pointer;min-width:0}
.wie-kaart .titel:hover{text-decoration:underline}
.wie-kaart a{font-size:13px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wie-kaart{border-top-color:var(--tekst-2)}}
/* kalender */
.kal-kop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.kal-kop .titel-m{font:700 28px/1 var(--cond);text-transform:capitalize;min-width:210px;text-align:center}
.kal-kop .rechts{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kal-kop select{border:1px solid var(--lijn);border-radius:6px;padding:6px 8px;background:var(--bg)}
.legenda{display:flex;gap:14px;font-size:13px;color:var(--tekst-2);flex-wrap:wrap;margin:10px 0 0}
.legenda span{display:inline-flex;align-items:center;gap:5px}
.legenda i{display:inline-block;width:14px;height:10px;border-radius:3px}
.takenbalk{border:1px solid var(--lijn);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.takenbalk h3{display:flex;gap:8px;align-items:center;margin-bottom:6px;text-transform:capitalize}
.takenbalk .chips{display:flex;flex-wrap:wrap;gap:6px 18px}
.tchip{display:flex;align-items:flex-start;gap:6px;font-size:14.5px}
.tchip input{margin-top:2px}
.tchip span{cursor:pointer}
.tchip.klaar span{text-decoration:line-through;color:var(--tekst-2)}
.tchip.laat span{color:var(--rood)}
.tchip small{color:var(--tekst-2)}
.kal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--lijn);border-top:1px solid var(--lijn);border-radius:6px;overflow:hidden}
.kal-wd{font:600 13px var(--body);color:var(--tekst-2);padding:6px 8px;border-right:1px solid var(--lijn);border-bottom:1px solid var(--lijn);background:var(--vlak)}
.dag-cel{min-height:120px;border-right:1px solid var(--lijn);border-bottom:1px solid var(--lijn);padding:4px 5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dag-cel.buiten{background:var(--vlak)}
.dag-cel.buiten .dnr{color:var(--tekst-2);font-weight:600}
.dag-kop{display:flex;justify-content:space-between;align-items:center;min-height:26px}
.dnr{font:700 17px/1 var(--cond);display:inline-grid;place-items:center;min-width:26px;height:26px}
.dag-cel.zo .dnr{color:var(--oranje-diep)}
.dag-cel.vandaag .dnr{background:var(--oranje);color:#1A1A1A;border-radius:50%}
.plus{border:0;background:none;color:var(--tekst-2);cursor:pointer;opacity:0;font-size:19px;line-height:1;padding:0 4px}
.dag-cel:hover .plus,.plus:focus-visible{opacity:1}
@media (hover:none){.plus{opacity:.6}}
.it{display:block;width:100%;text-align:left;border:0;border-radius:4px;padding:3px 6px;font:500 12.5px/1.35 var(--body);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it-wed.thuis{background:var(--oranje);color:#1A1A1A}
.it-wed.uit{background:var(--zwart);color:#fff}
.it-wed b{font-weight:700;letter-spacing:.04em;margin-right:3px}
.it-inhaal{background:transparent;color:var(--tekst-2);border:1px dashed var(--lijn)}
.it-afspr{background:var(--oranje-zacht);color:var(--tekst);border-left:3px solid var(--oranje)}
.it-taak{background:var(--vlak);color:var(--tekst);border-left:3px solid var(--tekst-2)}
.it-taak.laat{border-left-color:var(--rood)}
.it-taak.klaar{text-decoration:line-through;color:var(--tekst-2)}
.dag-lang{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .it-wed.uit{background:#F2F0ED;color:#1A1A1A}}
:root[data-theme="dark"] .it-wed.uit{background:#F2F0ED;color:#1A1A1A}
@media (max-width:700px){
  .kal-grid{display:block;border:0;border-radius:0}
  .kal-wd{display:none}
  .dag-cel{min-height:0;border:0;border-top:1px solid var(--lijn);padding:8px 0}
  .dag-cel.leeg-dag,.dag-cel.buiten{display:none}
  .dag-kop{justify-content:flex-start;gap:4px}
  .dag-lang{display:inline;font-weight:600;flex:1}
  .it{font-size:14px;padding:6px 8px;white-space:normal}
  .kal-kop .titel-m{min-width:0;font-size:24px}
}
/* formulieren */
dialog{border:0;border-radius:10px;padding:0;width:min(520px,94vw);background:var(--bg);color:var(--tekst);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-kop{padding:16px 20px;border-bottom:1px solid var(--lijn);display:flex;justify-content:space-between;align-items:center}
.dlg-kop h2{margin:0}
.dlg-body{padding:16px 20px;display:grid;gap:12px;max-height:65vh;overflow-y:auto}
.dlg-voet{padding:12px 20px;border-top:1px solid var(--lijn);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.dlg-voet .links{margin-right:auto}
.veld label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.veld input:not([type=checkbox]),.veld select,.veld textarea,textarea.groot{width:100%;border:1px solid var(--lijn);border-radius:6px;padding:8px 10px;background:var(--bg)}
.veld .hint{font-size:13px;color:var(--tekst-2);margin-top:3px}
.veld.check{display:flex;gap:8px;align-items:center}
.veld.check label{margin:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea.groot{min-height:90px;resize:vertical}
.voorstel{border:1px solid var(--lijn);border-radius:6px;padding:8px 10px;display:flex;gap:10px;margin-top:8px;font-size:15px}
.voorstel.gedaan{opacity:.6}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--zwart);color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F2F0ED;color:#1A1A1A}}
.persoon{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--lijn);font-size:15px}
.persoon:first-of-type{border-top:0}
.persoon .meta{color:var(--tekst-2);font-size:14px}
@media (max-width:560px){h1{font-size:28px} .duo{grid-template-columns:1fr} main{padding:18px 14px 50px} .top-in{padding:10px 14px 0}}
@media (prefers-reduced-motion:no-preference){.strook a.nu{animation:opl .6s ease-out 1}}
@keyframes opl{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="merk"><b>SDO’<span>39</span> TC</b><small id="seizoenLabel">Seizoen</small></div>
    <nav class="tabs" id="tabs" aria-label="Onderdelen">
      <a href="#overzicht" data-v="overzicht">Overzicht</a>
      <a href="#jaar" data-v="jaar">Jaarplanning</a>
      <a href="#taken" data-v="taken">Takenlijst</a>
      <a href="#agenda" data-v="agenda">Vergaderingen</a>
      <a href="#wedstrijden" data-v="wedstrijden">Wedstrijden &amp; inzet</a>
      <a href="#vlaggers" data-v="vlaggers">Vlaggers</a>
      <a href="#velden" data-v="velden">Velden</a>
      <a href="#instellingen" data-v="instellingen">Instellingen</a>
    </nav>
    <button class="uitlog" id="uitlog" hidden>Uitloggen</button>
  </div>
</header>
<main>
  <div id="status"></div>
  <div id="view"></div>
</main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
"use strict";
const MAANDEN=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MKORT=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DAGEN=["zo","ma","di","wo","do","vr","za"];

/* ---------- taken-logica ---------- */
function vervalVan(t){if(t.deadline)return pd(t.deadline);const m=Number(t.maand??6);return new Date(jaarVan(m),m+1,0)}
function startVan(t){return plus(vervalVan(t),-7*Number(t.weken??2))}
function fase(t){
  if(t.status==="klaar")return"klaar";
  const v=vandaag();
  if(v>vervalVan(t))return"laat";
  if(t.status==="bezig")return"bezig";
  if(v>=startVan(t))return"nu";
  return"later";
}

const COLLS=["taken","agenda","wedstrijden","verzoeken","notities"];
function nieuwId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lokaal(coll,id,data){
  if(coll==="tc"){if(id==="instellingen")S.settings=data;return}
  if(!S[coll])return;const i=S[coll].findIndex(x=>x.id===id);const n={...data,id};
  if(i>=0)S[coll][i]=n;else S[coll].push(n);
}
function lokaalWeg(coll,id){if(coll==="tc"){if(id==="instellingen")S.settings=null;return}if(S[coll])S[coll]=S[coll].filter(x=>x.id!==id)}
async function bewaar(coll,obj){
  if(ui.leesAlleen){toast("Je kunt hier alleen meekijken.");return null}
  const body=JSON.parse(JSON.stringify(obj));delete body.id;body.bijgewerkt=new Date().toISOString();
  const id=obj.id||nieuwId();
  lokaal(coll,id,body);render();
  if(!sb)return id;
  const {error}=await sb.from("items").upsert({coll,id,data:body,bijgewerkt:body.bijgewerkt});
  if(error){fout(error);laadAlles()}
  return id;
}
async function wis(coll,id){
  if(ui.leesAlleen)return;
  lokaalWeg(coll,id);render();
  if(!sb)return;
  const {error}=await sb.from("items").delete().match({coll,id});
  if(error){fout(error);laadAlles()}
}
async function bewaarInstellingen(nieuw){await bewaar("tc",{...cfg(),...nieuw,id:"instellingen"})}
function fout(e){console.warn(e);toast("Opslaan lukte niet"+(e&&e.message?": "+e.message:"")+".")}
async function laadAlles(){
  const {data,error}=await sb.from("items").select("coll,id,data").range(0,9999);
  if(error){fout(error);return}
  COLLS.forEach(k=>S[k]=[]);S.settings=null;

}

function taakRij(t,opts={}){

  const wanneer=t.deadline?"uiterlijk "+fmt(t.deadline):MAANDEN[t.maand];
  const wie=opts.wieKiezer
    ? `<select class="mini ${t.wie?"":"open"}" data-act="taakWie" data-id="${t.id}" aria-label="Wie pakt dit op">${wieOpties(t.wie)}</select>`
    : (t.wie?esc(t.wie):'<span class="waarsch" style="color:var(--oranje-diep)">nog niemand</span>');
  return `<div class="rij ${f==="klaar"?"klaar":""}">
    <input type="checkbox" data-act="taakKlaar" data-id="${t.id}" ${t.status==="klaar"?"checked":""} aria-label="Afvinken: ${esc(t.titel)}">
    <div class="info"><div class="titel" data-act="taakBewerk" data-id="${t.id}" tabindex="0">${esc(t.titel)}</div>
    <div class="meta">${[opts.geenMaand?"":esc(wanneer),opts.wieKiezer?"":wie,t.jaarlijks?"↻ jaarlijks":"",t.team?esc(t.team):"",t.veld?esc(t.veld):"",t.rol?esc(t.rol):"",t.categorie&&!opts.kort?esc(t.categorie):""].filter(Boolean).join(" · ")}</div></div>
    ${opts.wieKiezer?wie:""}
    ${opts.label!==false&&f!=="later"?`<span class="label ${f}">${FASE_LABEL[f]}</span>`:""}
  </div>`;
}
function strook(){
  const nu=huidigeMaand();const vIdx=VOLGORDE.indexOf(nu);
  return `<nav class="strook" aria-label="Seizoen per maand">${VOLGORDE.map((m,i)=>{
    const tk=S.taken.filter(t=>Number(t.maand)===m);const k=tk.filter(t=>t.status==="klaar").length;
    const laat=tk.filter(t=>fase(t)==="laat").length;
    const pct=tk.length?Math.round(k/tk.length*100):0;
    return `<a href="#jaar" data-act="naarMaand" data-m="${m}" class="${m===nu?"nu":""} ${i<vIdx?"voorbij":""}" title="${MAANDEN[m]}: ${k} van ${tk.length} klaar">
      <span class="mnd">${MKORT[m]}</span><span class="tel">${laat?`<span class="waarsch">${laat} te laat</span>`:`${k}/${tk.length}`}</span><span class="balk"><i style="width:${pct}%"></i></span></a>`}).join("")}</nav>`;
}
function komendeAfspraken(dagen){const v=vandaag(),e=plus(v,dagen);return S.agenda.filter(a=>{const d=pd(a.datum);return d&&d>=v&&d<=e}).sort((a,b)=>(a.datum+(a.tijd||"")).localeCompare(b.datum+(b.tijd||"")))}
function afsprRij(a,knoppen){
  const d=pd(a.datum);
  return `<div class="rij"><div class="datumblok"><b>${d.getDate()}</b><small>${MKORT[d.getMonth()]}</small></div>
  <div class="info"><div class="titel" data-act="afsprBewerk" data-id="${a.id}" tabindex="0">${esc(a.titel)}</div>
  <div class="meta">${DAGEN[d.getDay()]}${a.tijd?" "+esc(a.tijd):""}${a.locatie?" · "+esc(a.locatie):""}${a.type?" · "+esc(a.type):""}</div>
  ${knoppen?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${downloads?`<button class="btn klein" data-act="ics" data-id="${a.id}">Zet in mijn agenda (.ics)</button>`:""}<a class="btn klein" target="_blank" rel="noopener" href="${googleLink(a)}">Google Agenda</a></div>`:""}</div></div>`;
}
function vlagTeam(){return cfg().vlagTeam||cfg().teams[0]}
function personen(){const c=cfg();return [...new Set([...(c.leden||[]),...(c.pool||[])])]}
function wieOpties(huidig){const c=cfg();const pool=(c.pool||[]).filter(n=>!(c.leden||[]).includes(n));const o=(n)=>`<option value="${esc(n)}" ${n===(huidig||"")?"selected":""}>${esc(n)}</option>`;
  return `<option value="" ${!huidig?"selected":""}>Nog niemand</option>${c.leden.length?`<optgroup label="TC-leden">${c.leden.map(o).join("")}</optgroup>`:""}${pool.length?`<optgroup label="Scheidsrechters &amp; vlaggers">${pool.map(o).join("")}</optgroup>`:""}${huidig&&!personen().includes(huidig)?o(huidig):""}`}
function rolNodig(w,r){if(w.inhaal)return false;if(r==="Vlagger")return w.team===vlagTeam();if(r==="Scheidsrechter")return !!w.thuis&&w.team!==vlagTeam();return !!w.thuis}
function openRollen(w){return cfg().rollen.filter(r=>rolNodig(w,r)&&!(w.inzet&&w.inzet[r]))}
function kortTeam(t){return String(t||"").replace(/^SDO[’']39\s*/,"").replace(/^SVO RDM\s*/,"")||t}
function takenVanMaand(m){return S.taken.filter(t=>Number(t.maand)===m).sort((a,b)=>(a.status==="klaar")-(b.status==="klaar")||vervalVan(a)-vervalVan(b))}
function wedstrijdenTussen(van,tot){return S.wedstrijden.filter(w=>{const d=pd(w.datum);return d&&d>=van&&d<=tot}).sort((a,b)=>(a.datum+(a.tijd||"")).localeCompare(b.datum+(b.tijd||"")))}

  S.taken.filter(t=>t.deadline).forEach(t=>{const f=fase(t);zet(t.deadline,`<button class="it it-taak ${f==="laat"?"laat":""} ${f==="klaar"?"klaar":""}" data-act="taakBewerk" data-id="${t.id}" title="Deadline: ${esc(t.titel)}">${esc(t.titel)}</button>`,"1")});
  S.wedstrijden.filter(wedOk).forEach(w=>{
    if(w.inhaal){zet(w.datum,`<button class="it it-inhaal" data-act="wedBewerk" data-id="${w.id}">Inhaal/beker ${esc(kortTeam(w.team))}</button>`,"3");return}
    zet(w.datum,`<button class="it it-wed ${w.thuis?"thuis":"uit"}" data-act="wedBewerk" data-id="${w.id}" title="${esc((w.tijd?w.tijd+" ":"")+(w.thuis?w.team+" – "+w.tegen:w.tegen+" – "+w.team))}"><b>${w.thuis?"THUIS":"UIT"}</b> ${esc(kortTeam(w.team))}${w.tijd?" · "+esc(w.tijd):""} · ${esc(w.tegen)}</button>`,"2"+(w.tijd||""));
  });
  const cellen=[];
  for(let d=new Date(start);d<=eind;d=plus(d,1)){
    const k=iso(d);const items=(opDag[k]||[]).sort((p,q)=>p[0].localeCompare(q[0])).map(x=>x[1]);
    const buiten=d.getMonth()!==m;
    cellen.push(`<div class="dag-cel ${buiten?"buiten":""} ${k===vd?"vandaag":""} ${d.getDay()===0?"zo":""} ${items.length||k===vd?"":"leeg-dag"}">
      <div class="dag-kop"><span class="dnr">${d.getDate()}</span><span class="dag-lang">${esc(fmtLang(k))}</span><button class="plus" data-act="afsprNieuw" data-datum="${k}" aria-label="Vergadering op ${esc(fmtLang(k))}" title="Vergadering plannen">+</button></div>${items.join("")}</div>`);
  }
  const tk=inSeizoen(eerste)?takenVanMaand(m).filter(t=>!t.deadline):[];
  return `<div class="kopregel"><div><h1>Jaarkalender</h1><p class="sub">Vergaderingen, taken en alle wedstrijden in één agenda. Klik op een dag om een vergadering te plannen.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="afsprNieuw">Vergadering plannen</button><button class="btn hoofd" data-act="taakNieuw" data-m="${m}">Taak toevoegen</button></div></div>
  ${strook()}
  <div class="kal-kop"><button class="btn" data-act="kalVorige" aria-label="Vorige maand">‹</button><span class="titel-m">${MAANDEN[m]} ${y}</span><button class="btn" data-act="kalVolgende" aria-label="Volgende maand">›</button><button class="btn kaal" data-act="kalNu">Vandaag</button>
    <div class="rechts"><select data-act="kalTeam" aria-label="Team"><option value="">Alle teams</option>${c.teams.map(t=>`<option ${ui.kalTeam===t?"selected":""}>${esc(t)}</option>`).join("")}</select></div></div>
  ${inSeizoen(eerste)?`<div class="takenbalk"><h3>Taken in ${MAANDEN[m]} <span class="label">${tk.filter(t=>t.status==="klaar").length}/${tk.length} klaar</span></h3>${tk.length?`<div class="chips">${tk.map(t=>{const f=fase(t);return `<label class="tchip ${f==="klaar"?"klaar":""} ${f==="laat"?"laat":""}"><input type="checkbox" data-act="taakKlaar" data-id="${t.id}" ${t.status==="klaar"?"checked":""}><span data-act="taakBewerk" data-id="${t.id}">${esc(t.titel)}${t.wie?` <small>(${esc(t.wie)})</small>`:""}</span></label>`}).join("")}</div>`:`<p class="leeg" style="padding:0">Geen taken deze maand.</p>`}</div>`:""}
  <div class="kal-grid">${["ma","di","wo","do","vr","za","zo"].map(d=>`<div class="kal-wd">${d}</div>`).join("")}${cellen.join("")}</div>
  <div class="legenda"><span><i style="background:var(--oranje)"></i>Thuis</span><span><i style="background:var(--zwart);outline:1px solid var(--lijn)"></i>Uit</span><span><i style="background:var(--oranje-zacht);border-left:3px solid var(--oranje)"></i>Vergadering</span><span><i style="background:var(--vlak);border-left:3px solid var(--tekst-2)"></i>Taak met deadline</span></div>`;
},
taken(){
  const c=cfg();
  let tk=S.taken.slice();
  if(ui.fPersoon==="-")tk=tk.filter(t=>!t.wie);else if(ui.fPersoon)tk=tk.filter(t=>t.wie===ui.fPersoon);
  if(ui.fCat)tk=tk.filter(t=>t.categorie===ui.fCat);
  if(ui.fTeam)tk=tk.filter(t=>t.team===ui.fTeam);
  const groepen=["laat","nu","bezig","later"].concat(ui.toonKlaar?["klaar"]:[]);
  return `<div class="kopregel"><div><h1>Takenlijst</h1><p class="sub">De actieve checklist: wie werkt waaraan, en wat moet nu gebeuren.</p></div><button class="btn hoofd" data-act="taakNieuw">Taak toevoegen</button></div>
  <div class="filters">
    <label>Persoon <select data-act="fPersoon"><option value="">Iedereen</option><option value="-" ${ui.fPersoon==="-"?"selected":""}>Nog niemand</option>${personen().map(n=>`<option ${ui.fPersoon===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
    <label>Team <select data-act="fTeam"><option value="">Alle</option>${c.teams.map(n=>`<option ${ui.fTeam===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
    <label>Onderwerp <select data-act="fCat"><option value="">Alles</option>${CATS.map(n=>`<option ${ui.fCat===n?"selected":""}>${esc(n)}</option>`).join("")}</select></label>
    <label><input type="checkbox" data-act="toonKlaar" ${ui.toonKlaar?"checked":""}> Afgeronde taken tonen</label>
  </div>
  ${groepen.map(g=>{const lijst=tk.filter(t=>fase(t)===g).sort((a,b)=>vervalVan(a)-vervalVan(b));if(!lijst.length)return"";
    return `<section class="sectie ${g}"><h3>${FASE_LABEL[g]} <span class="label">${lijst.length}</span></h3>${lijst.map(t=>taakRij(t,{wieKiezer:true,label:false})).join("")}</section>`}).join("")||`<p class="leeg">Geen taken met deze filters.</p>`}`;
},
agenda(){
  const v=vandaag();
  const kom=S.agenda.filter(a=>pd(a.datum)>=v).sort((a,b)=>(a.datum+(a.tijd||"")).localeCompare(b.datum+(b.tijd||"")));
  const oud=S.agenda.filter(a=>pd(a.datum)<v).sort((a,b)=>b.datum.localeCompare(a.datum));
  return `<div class="kopregel"><div><h1>Vergaderingen &amp; bijeenkomsten</h1><p class="sub">Plan een moment en zet het met één klik in je eigen agenda.</p></div><button class="btn hoofd" data-act="afsprNieuw">Vergadering plannen</button></div>
  <section class="blok">${kom.length?kom.map(a=>afsprRij(a,true)).join(""):`<p class="leeg">Nog niets gepland.</p>`}</section>
  ${oud.length?`<p style="margin-top:18px"><button class="btn kaal" data-act="toonOud">${ui.toonOud?"Verberg":"Toon"} ${oud.length} eerdere</button></p>${ui.toonOud?`<section class="blok">${oud.map(a=>afsprRij(a,false)).join("")}</section>`:""}`:""}`;
},
wedstrijden(){
  const c=cfg();const v=vandaag();
  let lijst=S.wedstrijden.filter(w=>(ui.toonOud||pd(w.datum)>=plus(v,-1))&&(!ui.wTeam||w.team===ui.wTeam)&&(!ui.wThuis||w.thuis)).sort((a,b)=>(a.datum+(a.tijd||"")).localeCompare(b.datum+(b.tijd||"")));
  const pers=[...new Set([...c.pool,...c.leden])];
  let dag="";
  const rijen=lijst.map(w=>{
    let kop="";if(w.datum!==dag){dag=w.datum;kop=`<tr class="dag"><td colspan="${5+c.rollen.length}">${esc(fmtLang(w.datum))}</td></tr>`}
    const rollen=c.rollen.map(r=>{
      if(!rolNodig(w,r))return `<td></td>`;
      const cur=(w.inzet&&w.inzet[r])||"";
      return `<td><select class="mini ${cur?"":"open"}" data-act="inzet" data-id="${w.id}" data-rol="${esc(r)}" aria-label="${esc(r)}"><option value="">Open</option>${pers.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("")}${cur&&!pers.includes(cur)?`<option selected>${esc(cur)}</option>`:""}<option value="__ander">Iemand anders…</option></select></td>`}).join("");
    return kop+`<tr><td class="nowrap">${esc(w.tijd||"")}</td><td><b>${esc(w.team)}</b> – ${esc(w.tegen)}</td><td>${w.inhaal?'<span class="label">Inhaal/beker</span>':w.thuis?'<span class="label thuis">Thuis</span>':'<span class="label">Uit</span>'}</td><td>${w.thuis&&!w.inhaal?(w.veld?esc(w.veld):'<span style="color:var(--rood)">kies veld</span>'):""}</td>${rollen}<td><button class="btn kaal" data-act="wedBewerk" data-id="${w.id}">Bewerk</button></td></tr>`;
  }).join("");
  const teller={};S.wedstrijden.forEach(w=>{if(!inSeizoen(pd(w.datum)))return;Object.values(w.inzet||{}).forEach(n=>{if(n)teller[n]=(teller[n]||0)+1})});
  const tel=Object.entries(teller).sort((a,b)=>b[1]-a[1]);
  return `<div class="kopregel"><div><h1>Wedstrijden &amp; inzet</h1><p class="sub">Alle teams. Een scheidsrechter is nodig bij thuiswedstrijden van de lagere teams, een vlagger bij het eerste elftal. Lege plekken zijn oranje.</p></div><button class="btn hoofd" data-act="wedNieuw">Wedstrijd toevoegen</button></div>
  <div class="raster" style="margin-bottom:22px">
    <section class="blok"><h2>Nieuwe speelronde?</h2><p style="font-size:15px;color:var(--tekst-2);margin:0">Voeg wedstrijden toe met ‘Wedstrijd toevoegen’. Het programma staat op <a href="https://sdo39.nl/senioren/programma" target="_blank" rel="noopener">sdo39.nl</a> en in de Voetbal.nl-app.</p></section>
    <section class="blok"><h2>Inzet dit seizoen <small>verdeel eerlijk</small></h2>${tel.length?tel.map(([n,k])=>`<div class="persoon"><span>${esc(n)}</span><span class="meta">${k}×</span></div>`).join(""):`<p class="leeg">Nog niemand ingezet.</p>`}</section>
  </div>
  <div class="filters"><label>Team <select data-act="wTeam"><option value="">Alle teams</option>${c.teams.map(t=>`<option ${ui.wTeam===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label><label><input type="checkbox" data-act="wThuis" ${ui.wThuis?"checked":""}> Alleen thuiswedstrijden</label></div>
  <div class="tabel-wrap"><table><thead><tr><th>Tijd</th><th>Wedstrijd</th><th></th><th>Veld</th>${c.rollen.map(r=>`<th>${esc(r)}</th>`).join("")}<th></th></tr></thead><tbody>${rijen||`<tr><td colspan="${5+c.rollen.length}" class="leeg">Nog geen wedstrijden. Lees het programma in of voeg er een toe.</td></tr>`}</tbody></table></div>
  <p><button class="btn kaal" data-act="toonOud">${ui.toonOud?"Verberg gespeelde wedstrijden":"Toon ook gespeelde wedstrijden"}</button></p>`;
},
velden(){
  const c=cfg();const v=vandaag();
  const data=[...new Set(S.wedstrijden.filter(w=>w.thuis&&pd(w.datum)>=v).map(w=>w.datum))].sort();
  if(!ui.veldDatum||(!data.includes(ui.veldDatum)&&pd(ui.veldDatum)<v))ui.veldDatum=data[0]||iso(v);
  const dag=S.wedstrijden.filter(w=>w.thuis&&w.datum===ui.veldDatum);
  const BEGIN=9,EIND=19,SPAN=(EIND-BEGIN)*60;
  const duur=w=>Number(w.duur)||(/45\+|35\+|veteranen/i.test(w.team)?90:110);
  const mins=t=>{const[h,m]=(t||"00:00").split(":").map(Number);return h*60+m};
  const conflict=new Set();
  c.velden.forEach(vn=>{const op=dag.filter(w=>w.veld===vn);op.forEach(a=>op.forEach(b=>{if(a!==b&&mins(a.tijd)<mins(b.tijd)+duur(b)&&mins(b.tijd)<mins(a.tijd)+duur(a)){conflict.add(a.id);conflict.add(b.id)}}))});
  const zonder=dag.filter(w=>!w.veld||!c.velden.includes(w.veld)||!w.tijd);
  const blok=w=>{const l=(mins(w.tijd)-BEGIN*60)/SPAN*100,b=duur(w)/SPAN*100;return `<div class="tl-blok ${conflict.has(w.id)?"conflict":""}" style="left:${Math.max(0,l)}%;width:${b}%" data-act="wedBewerk" data-id="${w.id}" title="${esc(w.tijd+" "+w.team+" – "+w.tegen)}">${esc(w.tijd)} ${esc(w.team)}</div>`};
  return `<div class="kopregel"><div><h1>Veldbezetting</h1><p class="sub">Thuiswedstrijden per veld. Overlap kleurt rood; reken met ongeveer 110 minuten per wedstrijd inclusief warming-up.</p></div>
  <div class="filters" style="margin:0"><label>Dag <select data-act="veldDatum">${(data.includes(ui.veldDatum)?data:[ui.veldDatum,...data]).map(d=>`<option value="${d}" ${d===ui.veldDatum?"selected":""}>${esc(fmtLang(d))}</option>`).join("")}</select></label><input type="date" value="${ui.veldDatum}" data-act="veldDatum2" aria-label="Andere datum" style="border:1px solid var(--lijn);border-radius:6px;padding:5px 8px;background:var(--bg)"></div></div>
  ${conflict.size?`<div class="melding" style="border-color:var(--rood);background:var(--rood-zacht)">${conflict.size} wedstrijden overlappen op hetzelfde veld. Klik op een rood blok om de tijd of het veld aan te passen.</div>`:""}
  ${zonder.length?`<div class="melding">${zonder.length} thuiswedstrijd${zonder.length>1?"en hebben":" heeft"} nog geen veld of aanvangstijd: ${zonder.map(w=>`<a href="#" data-act="wedBewerk" data-id="${w.id}">${esc(w.tijd+" "+w.team)}</a>`).join(", ")}.</div>`:""}
  <section class="blok"><div class="tabel-wrap"><div class="tijdlijn">
    <div class="tl-uren">${Array.from({length:EIND-BEGIN},(_,i)=>`<span>${BEGIN+i}:00</span>`).join("")}</div>
    ${c.velden.map(vn=>`<div class="tl-rij"><div class="tl-naam">${esc(vn)}</div><div class="tl-baan">${dag.filter(w=>w.veld===vn).map(blok).join("")}</div></div>`).join("")}
  </div></div>${!dag.length?`<p class="leeg">Geen thuiswedstrijden op deze dag.</p>`:""}</section>`;
},
vlaggers(){
  const c=cfg();const team=vlagTeam();const v=vandaag();
  const lijst=S.wedstrijden.filter(w=>w.team===team&&inSeizoen(pd(w.datum))).sort((a,b)=>(a.datum+(a.tijd||"")).localeCompare(b.datum+(b.tijd||"")));
  const pers=[...new Set([...c.pool,...c.leden])];
  const volg=lijst.find(w=>pd(w.datum)>=v&&!w.inhaal);
  const teller={};lijst.forEach(w=>{const n=w.inzet&&w.inzet.Vlagger;if(n)teller[n]=(teller[n]||0)+1});
  const open=lijst.filter(w=>pd(w.datum)>=v&&!w.inhaal&&!(w.inzet&&w.inzet.Vlagger)).length;
  const naam=w=>w.inhaal?"Inhaal/beker":w.thuis?"<b>SDO’39</b> – "+esc(w.tegen):esc(w.tegen)+" – <b>SDO’39</b>";
  let mnd=-1;
  const rijen=lijst.map(w=>{const d=pd(w.datum);let kop="";if(d.getMonth()!==mnd){mnd=d.getMonth();kop=`<tr class="dag"><td colspan="5" style="text-transform:capitalize">${MAANDEN[mnd]} ${d.getFullYear()}</td></tr>`}
    const cur=(w.inzet&&w.inzet.Vlagger)||"";
    const sel=`<select class="mini ${cur||w.inhaal?"":"open"}" data-act="inzet" data-id="${w.id}" data-rol="Vlagger" aria-label="Vlagger" ${ui.leesAlleen?"disabled":""}><option value="">${w.inhaal?"–":"Open"}</option>${pers.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("")}${cur&&!pers.includes(cur)?`<option selected>${esc(cur)}</option>`:""}<option value="__ander">Iemand anders…</option></select>`;
    const lab=w.inhaal?"":(w.thuis?'<span class="label thuis">Thuis</span>':'<span class="label">Uit</span>')+(w.beker?' <span class="label">Beker</span>':"");
    return kop+`<tr class="${d<v?"voorbij":""} ${w===volg?"volgende":""}"><td class="nowrap">${fmt(w.datum)}${w.tijd?" "+esc(w.tijd):""}</td><td>${naam(w)}</td><td class="nowrap">${lab}</td><td>${sel}</td><td><button class="btn kaal" data-act="wedBewerk" data-id="${w.id}">Bewerk</button></td></tr>`}).join("");
  const tel=Object.entries(teller).sort((a,b)=>b[1]-a[1]);
  return `<div class="kopregel"><div><h1>Vlaggerschema ${esc(team)}</h1><p class="sub">Alle wedstrijden van het eerste elftal, thuis en uit. De volgende wedstrijd is oranje gemarkeerd.${ui.vlagger?" Kun je niet? Laat het een TC-lid weten.":""}</p></div><button class="btn hoofd" data-act="wedNieuw">Wedstrijd toevoegen</button></div>
  <div class="raster" style="margin-bottom:22px">
    <section class="blok"><h2>Volgende wedstrijd</h2>${volg?`<div class="meta">${esc(fmtLang(volg.datum))}${volg.tijd?" om "+esc(volg.tijd):""}</div><div style="font-weight:600;margin:2px 0 10px">${naam(volg)}</div><div class="meta">Vlagger</div><div class="groot-naam">${esc((volg.inzet&&volg.inzet.Vlagger)||"Nog niemand")}</div>`:`<p class="leeg">Geen wedstrijden meer gepland.</p>`}</section>
    <section class="blok"><h2>Verdeling <small>${open?open+" nog open":"alles ingevuld"}</small></h2>${tel.length?tel.map(([n,k])=>`<div class="persoon"><span>${esc(n)}</span><span class="meta">${k}×</span></div>`).join(""):`<p class="leeg">Nog niemand ingedeeld.</p>`}</section>
  </div>
  <div class="tabel-wrap"><table><thead><tr><th>Datum</th><th>Wedstrijd</th><th></th><th>Vlagger</th><th></th></tr></thead><tbody>${rijen||`<tr><td colspan="5" class="leeg">Nog geen wedstrijden van ${esc(team)}.</td></tr>`}</tbody></table></div>`;
},
instellingen(){
  const c=cfg();
  const lijst=(k,t,h)=>`<div class="veld"><label for="set-${k}">${t}</label><textarea id="set-${k}" class="groot" data-set="${k}">${esc((c[k]||[]).join("\n"))}</textarea><div class="hint">${h}</div></div>`;
  return `<h1>Instellingen</h1><p class="sub">Eén naam of item per regel. Wijzigingen gelden voor iedereen die de tool gebruikt.</p>
  <div class="raster">
    <section class="blok">${lijst("leden","TC-leden","Voor het toewijzen van taken.")}</section>
    <section class="blok">${lijst("pool","Scheidsrechters &amp; vlaggers","Mensen die je kunt inzetten bij thuiswedstrijden.")}</section>
    <section class="blok">${lijst("teams","Teams","Gebruikt bij het inlezen van het programma.")}</section>
    <section class="blok">${lijst("velden","Velden","Voor de veldbezetting.")}${lijst("rollen","Rollen per thuiswedstrijd","Bijvoorbeeld Scheidsrechter, Vlagger, Wedstrijdsecretaris.")}</section>
    <section class="blok"><div class="veld"><label for="set-locatie">Standaardlocatie vergaderingen</label><input id="set-locatie" data-set1="locatie" value="${esc(c.locatie)}"></div>
      <p style="margin-top:14px"><button class="btn hoofd" data-act="instBewaar" ${ui.leesAlleen?"disabled":""}>Instellingen opslaan</button></p></section>
    <section class="blok"><h2>Nieuw seizoen</h2><p class="meta" style="color:var(--tekst-2);font-size:15px">Zet het seizoen op ${c.seizoen+1}–${c.seizoen+2}. Jaarlijkse taken gaan terug naar open en vaste deadlines schuiven een jaar op. Afgeronde eenmalige taken worden opgeruimd; openstaande eenmalige taken blijven staan.</p>
      <button class="btn" data-act="nieuwSeizoen" ${ui.leesAlleen?"disabled":""}>Start seizoen ${c.seizoen+1}–${c.seizoen+2}</button>

    <section class="blok breed"><h2>Toegang <small>wie mag erin</small></h2>
      <p style="font-size:15px;color:var(--tekst-2);margin:0 0 10px">TC-leden zien en bewerken alles. Vlaggers zien alleen het vlaggerschema en kunnen niets wijzigen. Iemand logt in met het e-mailadres dat hier staat.</p>
      ${S.toegang.length?`<div class="tabel-wrap"><table><thead><tr><th>E-mail</th><th>Naam</th><th>Rol</th><th></th></tr></thead><tbody>${S.toegang.map(t=>`<tr><td>${esc(t.email)}</td><td>${esc(t.naam||"")}</td><td><span class="label ${t.rol==="tc"?"thuis":""}">${t.rol==="tc"?"TC":"Vlagger"}</span></td><td>${(gebruiker&&t.email===gebruiker.email.toLowerCase())?"":`<button class="btn kaal" data-act="tgWis" data-email="${esc(t.email)}">Verwijderen</button>`}</td></tr>`).join("")}</tbody></table></div>`:""}
      <div class="duo" style="margin-top:12px"><div class="veld"><label for="tg-email">E-mailadres</label><input id="tg-email" type="email"></div><div class="veld"><label for="tg-naam">Naam</label><input id="tg-naam"></div></div>
      <div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px;flex-wrap:wrap"><div class="veld"><label for="tg-rol">Rol</label><select id="tg-rol"><option value="tc">TC-lid</option><option value="vlagger">Vlagger</option></select></div><button class="btn hoofd" data-act="tgAdd">Toegang geven</button></div>
    </section>
  </div>`;
}
};

function notitieBlok(){

function formulier(titel,velden,waarden,opslaan,verwijder){
  const f=$("#dlgForm");
  const veld=v=>{const val=waarden[v.k]??"";const id="f-"+v.k;
    if(v.type==="check")return `<div class="veld check"><input type="checkbox" id="${id}" name="${v.k}" ${val?"checked":""}><label for="${id}">${v.label}</label></div>`;
    let inp;
    if(v.type==="select")inp=`<select id="${id}" name="${v.k}">${v.opts.map(o=>{const[w,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(w)}" ${String(w)===String(val)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
    else if(v.type==="textarea")inp=`<textarea id="${id}" name="${v.k}" rows="3">${esc(val)}</textarea>`;
    else inp=`<input id="${id}" name="${v.k}" type="${v.type||"text"}" value="${esc(val)}" ${v.req?"required":""} ${v.list?`list="${id}-l"`:""}>${v.list?`<datalist id="${id}-l">${v.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
    return `<div class="veld"><label for="${id}">${v.label}</label>${inp}${v.hint?`<div class="hint">${v.hint}</div>`:""}</div>`};
  const html=[];for(let i=0;i<velden.length;i++){const v=velden[i];if(v.duo&&velden[i+1]){html.push(`<div class="duo">${veld(v)}${veld(velden[i+1])}</div>`);i++}else html.push(veld(v))}
  f.innerHTML=`<div class="dlg-kop"><h2>${esc(titel)}</h2><button type="button" class="btn kaal" data-dlg="sluit" aria-label="Sluiten">✕</button></div>
  <div class="dlg-body">${html.join("")}</div>
  <div class="dlg-voet">${verwijder?`<button type="button" class="btn kaal links" data-dlg="wis" style="color:var(--rood)">Verwijderen</button>`:""}<button type="button" class="btn" data-dlg="sluit">Annuleren</button><button type="submit" class="btn hoofd" value="ok">Opslaan</button></div>`;
  const dlg=$("#dlg");
  f.onclick=e=>{const b=e.target.closest("[data-dlg]");if(!b)return;if(b.dataset.dlg==="sluit")dlg.close();if(b.dataset.dlg==="wis"&&confirm("Weet je zeker dat je dit wilt verwijderen?")){dlg.close();verwijder()}};
  f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);const uit={};velden.forEach(v=>{uit[v.k]=v.type==="check"?fd.has(v.k):(fd.get(v.k)??"").toString().trim()});dlg.close();opslaan(uit)};
  dlg.showModal();const eerste=f.querySelector(".dlg-body input,.dlg-body select");if(eerste)eerste.focus();
}

    {k:"team",label:"Team (optioneel)",type:"select",opts:[["","Geen"],...c.teams,...(t.team&&!c.teams.includes(t.team)?[t.team]:[])],duo:true},
    {k:"veld",label:"Veld (optioneel)",type:"select",opts:[["","Geen"],...c.velden,...(t.veld&&!c.velden.includes(t.veld)?[t.veld]:[])]},
    {k:"rol",label:"Rol (optioneel)",type:"select",opts:[["","Geen"],...c.rollen,...(t.rol&&!c.rollen.includes(t.rol)?[t.rol]:[])]},
    {k:"jaarlijks",label:"Jaarlijks terugkerend: komt elk seizoen terug in dezelfde maand",type:"check"},
    {k:"notitie",label:"Notitie",type:"textarea"}
  ],{maand:huidigeMaand(),status:"open",weken:2,categorie:"Overig",...t},w=>{
    const d=pd(w.deadline);bewaar("taken",{...t,...w,maand:d?d.getMonth():Number(w.maand),weken:Math.max(0,Number(w.weken)||0)});toast(nieuw?"Taak toegevoegd.":"Taak opgeslagen.")
  },nieuw?null:()=>wis("taken",t.id));
}
function afsprForm(a){
  const c=cfg();const nieuw=!a.id;
  formulier(nieuw?"Vergadering plannen":"Vergadering bewerken",[
    {k:"titel",label:"Titel",req:true},
    {k:"type",label:"Soort",type:"select",opts:AFSPR_TYPES},
    {k:"datum",label:"Datum",type:"date",req:true,duo:true},{k:"tijd",label:"Tijd",type:"time"},
    {k:"duur",label:"Duur (minuten)",type:"number",duo:true},{k:"locatie",label:"Locatie"},
    {k:"notitie",label:"Agenda / notitie",type:"textarea"}
  ],{titel:"TC-vergadering",type:"TC-vergadering",tijd:"20:00",duur:90,locatie:c.locatie,...a},w=>{bewaar("agenda",{...a,...w,duur:Number(w.duur)||90});toast(nieuw?"Vergadering gepland.":"Vergadering opgeslagen.")},nieuw?null:()=>wis("agenda",a.id));
}
function wedForm(w){
  const c=cfg();const nieuw=!w.id;
  formulier(nieuw?"Wedstrijd toevoegen":"Wedstrijd bewerken",[
    {k:"datum",label:"Datum",type:"date",req:true,duo:true},{k:"tijd",label:"Aanvang",type:"time"},
    {k:"team",label:"Ons team",type:"select",opts:[...c.teams,...(w.team&&!c.teams.includes(w.team)?[w.team]:[])],duo:true},{k:"tegen",label:"Tegenstander",req:true},
    {k:"thuis",label:"Thuiswedstrijd",type:"check"},
    {k:"veld",label:"Veld",type:"select",opts:[["","Nog niet bepaald"],...c.velden],duo:true},{k:"duur",label:"Veld bezet (minuten)",type:"number",hint:"Leeg = standaard"},
    {k:"opmerking",label:"Opmerking",type:"textarea"}
  ],{thuis:true,team:c.teams[0],...w},x=>{bewaar("wedstrijden",{...w,...x,inzet:{...(w.inzet||{})},duur:x.duur?Number(x.duur):""});toast(nieuw?"Wedstrijd toegevoegd.":"Wedstrijd opgeslagen.")},nieuw?null:()=>wis("wedstrijden",w.id));
}

/* ---------- interactie ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;const id=el.dataset.id;
  if(["taakKlaar","vsKies","ivKies","toonKlaar","importBeeld","wThuis","importBackup"].includes(a))return; // via change
  if(el.tagName==="SELECT"||el.tagName==="INPUT"&&el.type!=="button")return;
  const acties={
    taakNieuw(){e.preventDefault();taakForm(el.dataset.m!=null?{maand:Number(el.dataset.m)}:{})},
    taakBewerk(){e.preventDefault();const t=S.taken.find(x=>x.id===id);if(t)taakForm({...t})},
    afsprNieuw(){e.preventDefault();afsprForm(el.dataset.datum?{datum:el.dataset.datum}:{})},
    kalVorige(){ui.kal=new Date(ui.kal.getFullYear(),ui.kal.getMonth()-1,1);render()},
    kalVolgende(){ui.kal=new Date(ui.kal.getFullYear(),ui.kal.getMonth()+1,1);render()},
    kalNu(){const n=new Date();ui.kal=new Date(n.getFullYear(),n.getMonth(),1);render()},
    afsprBewerk(){const t=S.agenda.find(x=>x.id===id);if(t)afsprForm({...t})},
    wedNieuw(){wedForm({})},
    wedBewerk(){e.preventDefault();const t=vindWed(id);if(t)wedForm({...t})},
    naar(){location.hash=el.dataset.v},
    naarMaand(){e.preventDefault();const m=Number(el.dataset.m);ui.kal=new Date(jaarVan(m),m,1);if(ui.view!=="jaar")location.hash="jaar";else render()},
    toonOud(){ui.toonOud=!ui.toonOud;render()},
    async ics(){const t=S.agenda.find(x=>x.id===id);if(!t||!downloads)return;try{await downloads.save({filename:(t.titel||"vergadering").replace(/[^\w\- ]+/g,"").trim()+" "+t.datum+".ics",data:maakIcs(t)})}catch(err){if(err&&err.code!=="cancelled"&&err.code!=="declined")toast("Downloaden lukte niet.")}},
    verzoekLees(){verzoekLees()},vsDoe(){vsDoe()},vsWeg(){ui.voorstellen=null;render()},
    importLees(){importLees()},ivDoe(){ivDoe()},ivWeg(){ui.importVoorstel=null;render()},
    instBewaar(){const nieuw={};document.querySelectorAll("[data-set]").forEach(t=>{nieuw[t.dataset.set]=t.value.split("\n").map(s=>s.trim()).filter(Boolean)});document.querySelectorAll("[data-set1]").forEach(t=>nieuw[t.dataset.set1]=t.value.trim());
      if(!nieuw.rollen.length)nieuw.rollen=DEF.rollen;if(!nieuw.velden.length)nieuw.velden=DEF.velden;bewaarInstellingen(nieuw).then(()=>toast("Instellingen opgeslagen."))},
    async nieuwSeizoen(){const c=cfg();if(!confirm(`Seizoen ${c.seizoen+1}–${c.seizoen+2} starten? Jaarlijkse taken gaan terug naar open en afgeronde eenmalige taken worden verwijderd.`))return;
      for(const t of S.taken.slice()){if(t.jaarlijks){const d=pd(t.deadline);const nd=d?iso(new Date(d.getFullYear()+1,d.getMonth(),d.getDate())):"";await bewaar("taken",{...t,status:"open",deadline:nd})}else if(t.status==="klaar")await wis("taken",t.id)}
      await bewaarInstellingen({seizoen:c.seizoen+1});toast("Nieuw seizoen gestart.")},
    notitieBewaar(){const t=(ui.notitie||"").trim();if(!t){toast("Typ eerst een notitie.");return}bewaar("notities",{tekst:t.slice(0,4000),datum:new Date().toISOString(),van:ui.notitieVan||""});ui.notitie="";render();toast("Notitie toegevoegd.")},
    async tgAdd(){const email=$("#tg-email").value.trim().toLowerCase(),naam=$("#tg-naam").value.trim(),r=$("#tg-rol").value;
      if(!/.+@.+\..+/.test(email)){toast("Vul een geldig e-mailadres in.");return}
      const {error}=await sb.from("toegang").upsert({email,naam,rol:r});if(error){fout(error);return}
      toast((naam||email)+" heeft nu toegang.");laadToegang()},
    async tgWis(){const email=el.dataset.email;if(!confirm("Toegang intrekken voor "+email+"?"))return;
      const {error}=await sb.from("toegang").delete().eq("email",email);if(error){fout(error);return}laadToegang()},
    filterPersoon(){e.preventDefault();ui.fPersoon=el.dataset.n;location.hash="taken";if(ui.view==="taken")render()},
    notitieWis(){if(confirm("Deze notitie verwijderen?"))wis("notities",id)},
    async export(){if(!downloads)return;try{await downloads.save({filename:"tc-sdo39-backup-"+iso(new Date())+".json",data:JSON.stringify({instellingen:cfg(),taken:S.taken,agenda:S.agenda,wedstrijden:S.wedstrijden,notities:S.notities},null,2)})}catch(_){}}
  };
  if(acties[a])acties[a]();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".titel[data-act],.afspr[data-act],.tl-blok"))e.target.click()});
document.addEventListener("input",e=>{const k=e.target.dataset.input;if(k)ui[k]=e.target.value});
document.addEventListener("change",e=>{
  const el=e.target;const a=el.dataset.act;const id=el.dataset.id;if(!a)return;
  if(a==="taakKlaar"){const t=S.taken.find(x=>x.id===id);if(t){bewaar("taken",{...t,status:el.checked?"klaar":"open"});if(el.checked)toast("Afgevinkt: "+t.titel)}}
  else if(a==="taakWie"){const t=S.taken.find(x=>x.id===id);if(t)bewaar("taken",{...t,wie:el.value,status:el.value&&t.status==="open"?"bezig":t.status})}
  else if(a==="inzet"){const w=vindWed(id);if(!w)return;let v=el.value;if(v==="__ander"){v=(prompt("Naam")||"").trim();if(!v){render();return}}bewaar("wedstrijden",{...w,inzet:{...(w.inzet||{}),[el.dataset.rol]:v}})}
  else if(a==="fPersoon"){ui.fPersoon=el.value;render()}
  else if(a==="fCat"){ui.fCat=el.value;render()}
  else if(a==="fTeam"){ui.fTeam=el.value;render()}
  else if(a==="wTeam"){ui.wTeam=el.value;render()}
  else if(a==="wThuis"){ui.wThuis=el.checked;render()}
  else if(a==="kalTeam"){ui.kalTeam=el.value;render()}
  else if(a==="toonKlaar"){ui.toonKlaar=el.checked;render()}
  else if(a==="veldDatum"||a==="veldDatum2"){if(el.value){ui.veldDatum=el.value;render()}}
  else if(a==="vsKies"){const x=ui.voorstellen&&ui.voorstellen.acties[Number(el.dataset.i)];if(x)x._uit=!el.checked}
  else if(a==="ivKies"){const x=ui.importVoorstel&&ui.importVoorstel[Number(el.dataset.i)];if(x)x._uit=!el.checked}
  else if(a==="importBeeld"){ui.importBeeld=el.files&&el.files[0]||null}
  else if(a==="notitieVan"){ui.notitieVan=el.value;try{localStorage.setItem("tc-van",el.value)}catch(_){}}
  else if(a==="importBackup"){const f=el.files&&el.files[0];if(f)herstelBackup(f);el.value=""}
});

start();
</script>
</body>
